# Pre-commit hooks — run on every commit
# Install: make bootstrap (or: pre-commit install)
# Manual run: pre-commit run --all-files

repos:
  # Ruff — format + lint (matches pyproject.toml config)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-format
        stages: [pre-commit]
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        stages: [pre-commit]

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        args: [--unsafe]
        stages: [pre-commit]
      - id: check-added-large-files
        args: [--maxkb=1000]
        stages: [pre-commit]

  # Secrets detection (commit-only — must not run on push where baseline
  # timestamp drift causes spurious failures)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: (\.env\.example|\.env\.production\.example|uv\.lock|pnpm-lock\.yaml|\.secrets\.baseline)$
        stages: [pre-commit]

  # MyPy — strict type checking on push (tracked files only, so untracked
  # WIP doesn't block pushes of unrelated commits)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'uv run mypy $(git ls-files "app/*.py" "app/**/*.py")'
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

  # App import smoke — catches startup-breaking import errors in app.main
  # before push (e.g. missing register_router, broken module imports).
  # Fast (~2s). Mirrors what the docker runtime hits on container start.
  - repo: local
    hooks:
      - id: app-import-smoke
        name: app import smoke
        entry: uv run python -c "from app.main import app; assert app.routes"
        language: system
        pass_filenames: false
        stages: [pre-push]

  # Logging taxonomy audit — fails if any logger.*() event in app/ is not
  # documented in docs/logging-standard.md. CI runs the same check via
  # TestLoggingTaxonomy; we catch it locally before push.
  - repo: local
    hooks:
      - id: audit-log-taxonomy
        name: audit log taxonomy
        entry: uv run python scripts/audit_log_taxonomy.py
        language: system
        pass_filenames: false
        stages: [pre-push]

  # Full test suite on push — catches wiring gaps and regressions that
  # pass in isolation but fail in the full CI suite (e.g. structlog cache
  # pollution, tests that set ENVIRONMENT=production without JWT_SECRET_KEY).
  # Requires `make db` (postgres + redis) running. ~75s — real cost, real catch rate.
  - repo: local
    hooks:
      - id: pytest
        name: pytest (full suite)
        entry: uv run pytest -x -q
        language: system
        pass_filenames: false
        stages: [pre-push]

  # Existing custom security hook (sensitive files, hardcoded creds, secrets regex)
  - repo: local
    hooks:
      - id: vtv-security
        name: VTV security checks
        entry: scripts/pre-commit
        language: script
        pass_filenames: false
        stages: [pre-commit]
