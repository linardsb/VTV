[project]
name = "vtv"
version = "0.1.0"
description = "VTV: Unified CMS and AI Agent Service for Riga City Bus Operations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.1",
    "asyncpg>=0.30.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.0.0",
    "cachetools>=5.5.0",
    "fastapi>=0.120.1",
    "google-genai>=1.0.0",
    "gunicorn>=23.0.0",
    "gtfs-realtime-bindings>=1.0.0",
    "httpx>=0.28.1",
    "openai>=2.20.0",
    "openpyxl>=3.1.5",
    "pgvector>=0.4.2",
    "pillow>=12.1.1",
    "pydantic-ai>=1.58.0",
    "pydantic-settings>=2.11.0",
    "pymupdf>=1.27.1",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.1",
    "python-jose[cryptography]>=3.3.0",
    "pyyaml>=6.0",
    "redis[hiredis]>=5.2.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.44",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.38.0",
    "geoalchemy2>=0.18.3",
    "lxml>=5.0.0",
    "pdfplumber>=0.11.9",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.18.2",
    "pip-audit>=2.7.0",
    "pyright>=1.1.407",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.2",
    "lxml-stubs>=0.5.0",
    "pre-commit>=4.5.1",
    "detect-secrets>=1.5.0",
]

[tool.uv]
# Force security patches for transitive dependencies flagged by pip-audit.
# These come via fastmcp/mcp/python-jose/pydantic-ai/openai — we pin minimums
# via override-dependencies so uv picks up CVE fixes during resolution.
override-dependencies = [
    "aiohttp>=3.13.4",       # CVE-2026-22815, CVE-2026-34513..34525 (10 CVEs: DoS, header injection, auth leak)
    "authlib>=1.6.9",        # CVE-2026-27962, CVE-2026-28490 (JWK header injection, crit bypass)
    "fastmcp>=3.2.0",        # CVE-2025-64340, CVE-2026-27124 (Windows CLI command injection, OAuthProxy Confused Deputy)
    "cryptography>=46.0.7",  # CVE-2026-34073, CVE-2026-39892 (name constraint bypass, buffer overflow)
    "ecdsa>=0.19.2",         # CVE-2026-33936
    "pyasn1>=0.6.3",         # CVE-2026-30922 (DoS via deep ASN.1 nesting)
    "pygments>=2.20.0",      # CVE-2026-4539 (ReDoS in AdlLexer)
    "pyjwt>=2.12.0",         # CVE-2026-32597 (unvalidated crit header)
    "requests>=2.33.0",      # CVE-2026-25645 (extract_zipped_paths tmpfile hijack)
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".mypy_cache",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear (catch mutable defaults, etc.)
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (modernize syntax)
    "ANN",    # flake8-annotations (enforce type hints)
    "S",      # flake8-bandit (security)
    "DTZ",    # flake8-datetimez (timezone-aware datetimes)
    "RUF",    # Ruff-specific rules
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib (prefer Path over os.path)
]

ignore = [
    "S311",   # Standard random is fine for non-crypto use
    "E501",   # Line too long (formatter handles this)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "ARG001", "D", "E731", "S105", "S106"]
"test_*.py" = ["S101", "ANN", "ARG001", "D", "E731", "S105", "S106"]
"**/tests/**/*.py" = ["S101", "ANN", "ARG001", "D", "E731", "S105", "S106"]  # Also apply to nested test directories
"__init__.py" = ["F401"]  # Allow unused imports in package init
"scripts/**/*.py" = ["T201"]  # Allow print in scripts
"app/core/health.py" = ["B008", "ARG001"]  # FastAPI Depends() + slowapi Request param
"app/core/agents/routes.py" = ["B008", "ARG001"]  # FastAPI Depends() + slowapi Request param
"app/transit/routes.py" = ["ARG001"]  # slowapi requires Request param for rate limiting
"app/stops/routes.py" = ["ARG001"]  # slowapi requires Request param for rate limiting
"app/knowledge/routes.py" = ["ARG001"]  # slowapi requires Request param for rate limiting
"app/schedules/routes.py" = ["ARG001"]  # slowapi requires Request param for rate limiting
"app/auth/routes.py" = ["ARG001"]  # slowapi requires Request param for rate limiting
"app/drivers/routes.py" = ["ARG001"]  # slowapi requires Request param for rate limiting
"app/events/routes.py" = ["ARG001"]  # slowapi requires Request param for rate limiting
"app/analytics/routes.py" = ["ARG001"]  # slowapi requires Request param for rate limiting
"app/vehicles/routes.py" = ["ARG001"]  # slowapi requires Request param for rate limiting
"app/core/rate_limit.py" = ["B008"]  # slowapi Limiter() at module level is the intended pattern

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# Practical strictness (not dogmatic)
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false

# Allow test files to have less strict typing
[[tool.mypy.overrides]]
module = "*.tests.*"
disallow_untyped_defs = false

# gtfs-realtime-bindings uses protobuf without py.typed marker
[[tool.mypy.overrides]]
module = "google.transit.*"
ignore_missing_imports = true

# slowapi lacks py.typed marker
[[tool.mypy.overrides]]
module = "slowapi.*"
ignore_missing_imports = true

# sentence-transformers lacks py.typed marker
[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

# pytesseract lacks py.typed marker
[[tool.mypy.overrides]]
module = "pytesseract.*"
ignore_missing_imports = true

# python-docx lacks py.typed marker
[[tool.mypy.overrides]]
module = "docx.*"
ignore_missing_imports = true

# pymupdf lacks py.typed marker
[[tool.mypy.overrides]]
module = "fitz.*"
ignore_missing_imports = true

# pdfplumber lacks py.typed marker
[[tool.mypy.overrides]]
module = "pdfplumber.*"
ignore_missing_imports = true

# geoalchemy2 lacks py.typed marker
[[tool.mypy.overrides]]
module = "geoalchemy2.*"
ignore_missing_imports = true

# pgvector lacks py.typed marker
[[tool.mypy.overrides]]
module = "pgvector.*"
ignore_missing_imports = true

# PyYAML ships stubs in a separate package (types-PyYAML) — treat as untyped here
[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

# openpyxl lacks py.typed marker
[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

# google-genai lacks py.typed marker
[[tool.mypy.overrides]]
module = "google.genai.*"
ignore_missing_imports = true

# redis has partial typing
[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

# cachetools lacks py.typed marker
[[tool.mypy.overrides]]
module = "cachetools.*"
ignore_missing_imports = true

# gunicorn lacks py.typed marker
[[tool.mypy.overrides]]
module = "gunicorn.*"
ignore_missing_imports = true

# python-jose lacks py.typed marker
[[tool.mypy.overrides]]
module = "jose.*"
ignore_missing_imports = true

# prometheus-client lacks py.typed marker
[[tool.mypy.overrides]]
module = "prometheus_client.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"  # Creates new event loop per test (proper isolation)
testpaths = ["app", "tests"]
markers = [
    "integration: marks tests requiring real database (deselect with '-m \"not integration\"')",
]

[tool.pyright]
include = ["app"]
exclude = [
    "**/__pycache__",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache"
]

# Python version configuration
pythonVersion = "3.12"
# Strict mode - enables all strict checks by default
typeCheckingMode = "strict"

# Test files can have unused functions and access private members
reportUnusedFunction = "none"
reportPrivateUsage = "none"

# gtfs-realtime-bindings lacks type stubs (protobuf-generated code)
reportMissingTypeStubs = "none"

# Lambda type inference in transit tools (protobuf-derived data)
reportUnknownLambdaType = "none"
