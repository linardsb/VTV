name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vtv_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 3

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/vtv_db
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Refresh detect-secrets baseline line numbers
        # detect-secrets pre-commit hook auto-updates .secrets.baseline
        # whenever tracked secrets' line numbers drift, then fails asking
        # the developer to `git add` it. CI has no developer to acknowledge
        # drift, so we regenerate the baseline before pre-commit runs.
        # `scan --baseline` merges known entries only — any net-new secret
        # still fails the downstream pre-commit hook, which remains the gate.
        run: |
          uv run detect-secrets scan --baseline .secrets.baseline
          git update-index --refresh .secrets.baseline || true

      - name: Pre-commit checks
        run: |
          uv run pre-commit run --all-files --show-diff-on-failure

      - name: Dependency audit
        run: uv run pip-audit --desc --ignore-vuln CVE-2025-69872 --ignore-vuln CVE-2024-23342 --ignore-vuln CVE-2026-3219

      - name: Lock file integrity
        run: uv lock --check

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint check
        run: uv run ruff check .

      - name: Security audit
        run: uv run ruff check app/ --select=S --no-fix

      - name: Type check (mypy)
        run: uv run mypy app/

      - name: Type check (pyright)
        run: uv run pyright app/

      - name: Install PostGIS in PostgreSQL service
        run: |
          container_id=$(docker ps -q --filter "ancestor=pgvector/pgvector:pg18")
          docker exec "$container_id" bash -c \
            "apt-get update && apt-get install -y --no-install-recommends postgresql-18-postgis-3 postgresql-18-postgis-3-scripts && rm -rf /var/lib/apt/lists/*"

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest -x -q

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cms

    env:
      AUTH_SECRET: ci-test-secret-minimum-32-characters-long
      NEXT_PUBLIC_AGENT_URL: http://localhost:8123

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cms/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter @vtv/web type-check

      - name: Lint
        run: pnpm --filter @vtv/web lint

      - name: Build
        run: pnpm --filter @vtv/web build

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]

    env:
      CI: true
      AUTH_SECRET: ci-test-secret-minimum-32-characters-long
      DEMO_USER_PASSWORD: e2e-test-password

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cms/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: cms
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: cms/apps/web
        run: npx playwright install --with-deps chromium

      - name: Create external Docker volume
        run: docker volume create vtv_postgres_data

      - name: Start services via Docker Compose
        run: docker compose up -d --build
        env:
          ENVIRONMENT: development
          DEMO_USER_PASSWORD: e2e-test-password

      - name: Verify migrations completed
        run: |
          echo "Waiting for migrate container to finish..."
          # Query the container state via `docker inspect` directly — the
          # previous `docker compose ps --format json | grep "exited"`
          # approach was brittle across compose versions (field casing and
          # key name differ: Status vs State, Exited vs exited) and
          # silently failed to match even when the container had exited.
          MIGRATE_CID=$(docker compose ps -aq migrate)
          timeout 180 bash -c "until [ \"\$(docker inspect --format='{{.State.Status}}' $MIGRATE_CID 2>/dev/null)\" = 'exited' ]; do sleep 2; done"
          echo "Checking migration exit code..."
          docker compose logs migrate
          EXIT_CODE=$(docker inspect --format='{{.State.ExitCode}}' "$MIGRATE_CID")
          if [ "$EXIT_CODE" != "0" ]; then echo "Migration failed with exit code $EXIT_CODE"; exit 1; fi
          echo "Migrations completed successfully"

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services..."
          timeout 180 bash -c 'until curl -sf http://localhost:80/health; do sleep 5; done'
          echo "Backend healthy"
          timeout 120 bash -c 'until curl -sf http://localhost:80; do sleep 5; done'
          echo "Frontend healthy"

      - name: Seed admin user for Playwright auth.setup
        # scripts/seed_admin.py inserts admin@vtv.lv with DEMO_USER_PASSWORD
        # directly via SQL (ON CONFLICT DO NOTHING). The `/v1/auth/seed`
        # HTTP endpoint is admin-only, so it can't bootstrap itself; and
        # the app's lifespan does not auto-seed. Playwright's
        # e2e/auth.setup.ts logs in as admin@vtv.lv, so without this step
        # auth.js returns CredentialsSignin and the whole suite fails
        # before the first test assertion.
        #
        # IMPORTANT: `docker compose exec` does NOT inherit the host shell
        # env by default. Pass DEMO_USER_PASSWORD explicitly with -e so it
        # lands inside the container; otherwise the script falls back to
        # "admin" and the seeded password drifts from what Playwright
        # sends (e2e-test-password), re-producing the CredentialsSignin.
        run: docker compose exec -T -e DEMO_USER_PASSWORD=e2e-test-password app python scripts/seed_admin.py  # pragma: allowlist secret

      - name: Smoke-test admin login end-to-end
        # Proves (a) the seed hit the DB the app reads from,
        # (b) the password round-trips through bcrypt, and
        # (c) the cms-internal fetch URL for auth.js is reachable
        # from inside the cms container. Fails the job here — before
        # Playwright — if any of those is broken, so the Playwright
        # failure diagnostics become unambiguous.
        run: |
          set -e
          echo "--- direct POST to app (through nginx proxy) ---"
          curl -sf -X POST http://localhost:80/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@vtv.lv","password":"e2e-test-password"}' \
            | head -c 200
          echo ""
          echo "--- POST from inside cms container to http://app:8123 (same path auth.js uses) ---"
          docker compose exec -T cms wget -qO- \
            --header='Content-Type: application/json' \
            --post-data='{"email":"admin@vtv.lv","password":"e2e-test-password"}' \
            http://app:8123/api/v1/auth/login \
            | head -c 200

      - name: Run Playwright tests
        working-directory: cms/apps/web
        run: npx playwright test
        env:
          BASE_URL: http://localhost:80

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose ps -a
          echo ""
          for svc in db redis migrate app cms nginx; do
            echo "=== logs: $svc ==="
            docker compose logs --tail=1000 "$svc" 2>&1 || true
            echo ""
          done

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: cms/apps/web/playwright-report/
          retention-days: 14

      - name: Stop services
        if: always()
        run: docker compose down
